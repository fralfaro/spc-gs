# Rejilla de 512x1024 (98 % de los píxeles de la imagen) CON 3DGS (la rejilla de 512x1024 solo
# tenía 2D en truck_512x1024). Hadamard y aleatorio, directa y TV, 5/10/25/50 %, 3000 y 7000
# iteraciones, semilla 449. El baseline (original) se reentrena con la misma tubería.
experimento: truck_512x1024_3d
descripcion: >
  Truck, 24 vistas (21 de entrenamiento y 3 de prueba), rejilla 512x1024; Hadamard y aleatorio
  con directa y TV al 5, 10, 25 y 50 %; 3DGS a 3000 y 7000 iteraciones. DCT queda solo en 2D.
escena: truck
semilla: 449

vistas:
  total: 24
  prueba: 3
  guardadas: {entrenamiento: 2, prueba: 2}

rejilla: [512, 1024]

spc:
  patrones_3d: [hadamard, random]
  patrones_solo_2d: [dct]
  metodos: [directa, tv]
  razones: [0.05, 0.10, 0.25, 0.50]
  ruido: null

tv: {lam: 0.003, iteraciones: 100, iter_prox: 20}

3dgs:
  iteraciones: [3000, 7000]
  semillas: [449]
  factor: 1
  grado_sh: 3
  condiciones: todas

evaluacion: {extendida: true}
