# Validación del baseline 3DGS contra el artículo original (Kerbl et al. 2023): Truck con TODAS las
# imágenes originales (251), 31 de prueba (una de cada 8, como el protocolo del artículo, desplazada
# 4 posiciones) y 220 de entrenamiento, resolución completa, 7000 iteraciones, semilla 449.
# Artículo (Truck, 7k): PSNR 23.506 / SSIM 0.840 / LPIPS 0.209. Sin SPC ni rejilla: solo "original".
experimento: truck_baseline_validacion
descripcion: >
  Baseline 3DGS con las 251 vistas (220 de entrenamiento, 31 de prueba) para compararlo con el
  artículo original. Usa el entrenador compacto sobre gsplat de este repositorio.
escena: truck
semilla: 449

rutas:
  imagenes: data/{escena}
  condiciones: data/conditions/{escena}_todas
  modelos: outputs/{escena}_todas
  resultados: results/{experimento}

vistas:
  total: 251
  prueba: 31
  guardadas: {entrenamiento: 2, prueba: 2}

rejilla: [256, 512]

spc:
  patrones_3d: []
  patrones_solo_2d: []
  metodos: [directa]
  razones: [0.25]
  ruido: null

tv: {lam: 0.003, iteraciones: 100, iter_prox: 20}

3dgs:
  iteraciones: [7000]
  semillas: [449]
  factor: 1
  grado_sh: 3
  condiciones: [original]

evaluacion: {extendida: false}
